<!-- Not Found State -->
@if (notFound()) {
  <div class="update-container">
    <div class="update-card not-found">
      <div class="not-found-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2>Dog Not Found</h2>
      <p>The dog you're trying to edit doesn't exist in the directory.</p>
      <a routerLink="/items" class="btn-submit">Back to Catalog</a>
    </div>
  </div>
} @else {
  <div class="update-container">
    <div class="update-card">
      <div class="update-header">
        <div class="update-header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </div>
        <div>
          <h2>Edit Dog Profile</h2>
          <p>Update the information for <strong>{{ name() }}</strong></p>
        </div>
      </div>

      <form (submit)="onSubmit($event)" class="update-form">

        <!-- Name Input -->
        <div class="form-group">
          <label for="u-name">Puppy Name</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="u-name"
              name="name"
              required
              placeholder="e.g. Max"
              autocomplete="off"
              [value]="name()"
              (input)="name.set($any($event.target).value)"
            />
          </div>
        </div>

        <!-- Breed Input -->
        <div class="form-group">
          <label for="u-breed">Breed</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <input
              type="text"
              id="u-breed"
              name="breed"
              required
              placeholder="e.g. Golden Retriever"
              autocomplete="off"
              [value]="breed()"
              (input)="breed.set($any($event.target).value)"
            />
          </div>
        </div>

        <!-- Age Input -->
        <div class="form-group">
          <label for="u-age">Age (Years)</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <input
              type="number"
              id="u-age"
              name="age"
              min="0"
              max="30"
              required
              placeholder="e.g. 2"
              autocomplete="off"
              [value]="age()"
              (input)="age.set(+$any($event.target).value)"
            />
          </div>
        </div>

        <!-- Image URL Input -->
        <div class="form-group">
          <label for="u-img">Image URL</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <input
              type="text"
              id="u-img"
              name="img"
              placeholder="https://..."
              autocomplete="off"
              [value]="img()"
              (input)="img.set($any($event.target).value)"
            />
          </div>
        </div>

        <!-- Live Preview -->
        @if (img()) {
          <div class="img-preview">
            <span class="preview-label">Preview</span>
            <img [src]="img()" [alt]="name()" class="preview-img" />
          </div>
        }

        <!-- Actions -->
        <div class="form-actions">
          <a routerLink="/items" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>
}
